left:auto;border-radius:999px;padding:6px 8px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;background:#f1ede5;color:#766f66;flex:none}.student.done .badge{background:#e8f4ed;color:var(--green)}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-3px)}.portrait{aspect-ratio:4/5;background:#eae4da;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover}.cardbody{padding:14px}.cardbody h3{font:600 21px Georgia,serif;margin:0 0 5px}.cardbody p{margin:0;color:var(--muted);font-size:12px}.empty{padding:42px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}.view{min-height:100vh}.pagehead{background:var(--navy);color:#fff;padding:22px 0}.back{background:none;border:0;color:inherit;padding:8px 0}.paper{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow);margin:28px auto}.formgrid{display:grid;gap:22px}.field label{display:block;font-weight:900;margin-bottom:8px}.field small{color:var(--muted);display:block;margin-top:6px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px;outline:none}.textarea{min-height:104px;resize:vertical;line-height:1.55}.input:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,174,97,.16)}.drop{border:2px dashed var(--line);border-radius:18px;padding:20px;text-align:center}.previewimg{width:min(220px,100%);aspect-ratio:4/5;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block;margin:12px auto}.audioBox{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fbf7ef}.timer{font:600 34px Georgia,serif;color:var(--red)}.msg{border-radius:12px;padding:11px 13px;font-size:14px;margin:12px 0}.msg.err{background:#faece9;color:#8d302e}.msg.ok{background:#e9f5ee;color:#1f6f53}.pinbox{max-width:440px;margin:48px auto}.pin{letter-spacing:.5em;text-align:center;font-size:28px}.modal{position:fixed;inset:0;background:rgba(3,13,22,.72);z-index:50;display:grid;place-items:center;padding:18px}.modalbox{width:min(920px,100%);max-height:92vh;overflow:auto;background:var(--navy);color:#fff;border-radius:24px;position:relative}.close{position:absolute;right:14px;top:14px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;width:42px;height:42px;border-radius:50%;z-index:2}.detail{display:grid;grid-template-columns:.88fr 1.12fr;gap:28px;padding:28px}.detail img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px}.detail h2{font:600 44px Georgia,serif;margin:8px 0}.detail .gold{color:var(--gold)}.answers dt{font:600 18px Georgia,serif;color:var(--gold);margin-top:18px}.answers dd{margin:5px 0 0;color:rgba(255,255,255,.82);line-height:1.55}.show{background:radial-gradient(circle at 15% 0,#19486f,var(--navy) 50%,#04121d);color:#fff;min-height:100vh}.showbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.11)}.slide{width:min(1280px,calc(100% - 42px));margin:auto;display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center;min-height:calc(100vh - 140px);padding:34px 0}.slide img{width:100%;max-height:72vh;object-fit:contain;border-radius:20px;box-shadow:0 24px 65px rgba(0,0,0,.28)}.slide h1{font:600 clamp(44px,5vw,72px) Georgia,serif;margin:10px 0}.slidecopy{max-height:72vh;overflow:auto;padding-right:8px}.showcontrols{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;padding:14px;background:rgba(3,14,24,.82);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.1)}.startshow{min-height:calc(100vh - 70px);display:grid;place-items:center;text-align:center;padding:30px}.startshow h1{font:600 58px Georgia,serif;margin:0 0 15px}.adminrow{display:grid;grid-template-columns:40px 1.5fr 1fr .7fr auto;gap:10px;align-items:center;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.togglecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.togglecard h3{margin:0 0 8px;font-family:Georgia,serif}.footer{padding:30px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:850px){.roster{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:repeat(2,1fr)}.detail,.slide{grid-template-columns:1fr}.slide{padding-bottom:100px}.slide img{max-height:43vh}.detail h2{font-size:34px}.adminrow{grid-template-columns:35px 1fr auto}.adminrow .hideMob{display:none}.toggles{grid-template-columns:1fr}}

<body>

<script>
const SUPABASE_URL='https://c--6c8ceb5d-b16b-4bf4-b1ac-ab4e351d8165-prod.lovable.cloud';
const SUPABASE_KEY='sb_publishable_W0h2ejPqkjViVGLCPQi2Yg_-V8ODrEW';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const app=document.getElementById('app'), modalRoot=document.getElementById('modalRoot');
let state={students:[],works:[],settings:{project_locked:false,public_publication:false,public_audio_enabled:false},filter:'',showIndex:0,showStarted:false};
const TEACHER='Махмудова Самира Ильхам гызы';
const SCHOOL='Bakı şəhəri · İlyas Əfəndiyev adına Elitar Gimnaziya';
const QUESTIONS=[['who_is_hero','Кто этот герой?'],['what_did','Чем он отличился?'],['why_chosen','Почему я выбрал(а) именно его?']];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const shortName=full=>{const p=full.trim().split(/\s+/);return p.length>1?`${p.slice(1).join(' ')} ${p[0][0]}.`:full};
const workFor=id=>state.works.find(w=>w.student_id===id);
function route(){return location.hash.slice(1)||'/';}
function go(r){location.hash=r}
window.go=go;
async function loadData(){
 const [s,w,st]=await Promise.all([
  sb.from('students').select('id,full_name,sort_order').order('sort_order'),
  sb.from('works').select('id,student_id,hero_name,photo_data,photo_mime,audio_data,audio_mime,audio_duration,who_is_hero,what_did,what_remembered,why_chosen,created_at,updated_at').order('updated_at',{ascending:false}),
  sb.from('project_settings').select('project_locked,public_publication,public_audio_enabled').eq('id',1).maybeSingle()
 ]);
 if(s.error) throw s.error;if(w.error) throw w.error;
 state.students=s.data||[];state.works=w.data||[];state.settings=st.data||state.settings;
}
async function boot(){try{await loadData();render()}catch(e){app.innerHTML=`<div class="wrap paper"><h2>Не удалось загрузить музей</h2><p class="sub">Проверьте интернет и обновите страницу.</p><div class="msg err">${esc(e.message)}</div></div>`}}
function nav(dark=true){return `<nav class="wrap"><div class="brand">✦ Память в наших сердцах</div><div class="navlinks"><button onclick="go('/')">Главная</button><button onclick="go('/exhibition')">Выставка</button><button onclick="go('/show')">Показ</button></div></nav>`}
function render(){modalRoot.innerHTML='';const r=route();if(r.startsWith('/student/'))return renderStudent(Number(r.split('/')[2]));if(r==='/exhibition')return renderExhibition();if(r==='/show')return renderShow();if(r==='/admin')return renderAdmin();renderHome()}
window.addEventListener('hashchange',render);
function stats(){return {done:state.works.length,audio:state.works.filter(w=>w.audio_data).length,total:state.students.length}}
function renderHome(){const x=stats();app.innerHTML=`<div class="top">${nav()}<div class="wrap hero"><div class="eyebrow">Цифровой музей · 3R4</div><div style="margin-top:12px;color:var(--gold);font-weight:800;letter-spacing:.04em">${SCHOOL}</div><h1>Память в наших сердцах</h1><p>Проект «Герои Отечественной войны». Выберите своё имя, подготовьте короткий рассказ о герое, добавьте его фотографию и запишите голос прямо на сайте.</p><p style="margin-top:10px;color:var(--gold);font-weight:700">Учитель: ${TEACHER}</p><div class="actions"><button class="btn gold" onclick="document.getElementById('students').scrollIntoView()">Выбрать своё имя</button><button class="btn outline" onclick="go('/show')">▶ Режим показа</button></div><div class="stats"><div class="stat"><span>Готово / ${x.total}</span><b>${x.done}</b></div><div class="stat"><span>Осталось</span><b>${x.total-x.done}</b></div><div class="stat"><span>С аудио</span><b>${x.audio}</b></div></div>${state.settings.project_locked?'<div class="msg ok" style="margin-top:22px;max-width:650px">Проект завершён: редактирование закрыто учителем.</div>':''}</div></div><main class="wrap"><section class="section"><h2>Как участвовать</h2><div class="steps">${['Найди своё имя в списке и открой карточку.','При первом входе придумай PIN из 4 цифр и запомни его.','Выбери героя, добавь его фотографию и ответь на три вопроса.','Запиши аудиорассказ до 2 минут и нажми «Сохранить работу».'].map((t,i)=>`<div class="step"><i>${i+1}</i><div>${t}</div></div>`).join('')}</div></section><section id="students" class="section"><h2>Ученики класса</h2><div class="toolbar"><p class="sub">Нажми на своё имя. Незавершённая карточка отмечена «В процессе».</p><input class="search" id="search" placeholder="Поиск по ученику или герою" value="${esc(state.filter)}" oninput="state.filter=this.value;renderRoster()"></div><div id="roster"></div></section><section class="section"><h2>Галерея готовых проектов</h2><p class="sub">Готовая работа появляется здесь после сохранения.</p><div id="gallery"></div></section></main><div class="footer">Цифровой музей 3R4 · ${SCHOOL} · ${TEACHER} · <button style="border:0;background:none;text-decoration:underline;color:inherit" onclick="go('/admin')">для учителя</button></div>`;renderRoster();renderGallery(false)}
function renderRoster(){const el=document.getElementById('roster');if(!el)return;const q=(state.filter||'').trim().toLowerCase();const rows=state.students.filter(s=>!q||s.full_name.toLowerCase().includes(q)||(workFor(s.id)?.hero_name||'').toLowerCase().includes(q));el.innerHTML=`<div class="roster">${rows.map(s=>{const w=workFor(s.id);return `<button class="student ${w?'done':''}" onclick="go('/student/${s.id}')"><span class="num">${s.sort_order}</span><span style="min-width:0;flex:1"><span class="sname">${esc(s.full_name)}</span><span class="hero-name">${w?esc(w.hero_name):'Герой ещё не выбран'}</span></span><span class="badge">${w?'✓ Готово':'В процессе'}</span></button>`}).join('')}</div>`}
function renderGallery(short){const el=document.getElementById('gallery');if(!el)return;if(!state.works.length){el.innerHTML='<div class="empty">Галерея пока пуста. Первая сохранённая работа появится здесь.</div>';return}const q=(state.filter||'').trim().toLowerCase();const works=state.works.filter(w=>!q||w.hero_name.toLowerCase().includes(q)||(state.students.find(s=>s.id===w.student_id)?.full_name||'').toLowerCase().includes(q));el.innerHTML=`<div class="gallery">${works.map(w=>{const s=state.students.find(x=>x.id===w.student_id);const nm=s?(short?shortName(s.full_name):s.full_name):'';return `<article class="card" onclick="openWork('${w.id}',${short})"><div class="portrait">${w.photo_data?`<img src="${w.photo_data}" alt="${esc(w.hero_name)}">`:''}</div><div class="cardbody"><h3>${esc(w.hero_name)}</h3><p>${esc(nm)} ${w.audio_data?'· 🎙':''}</p><button class="btn navy" style="margin-top:12px;padding:9px 13px">Открыть</button></div></article>`}).join('')}</div>`}
window.openWork=(id,short=false)=>{const w=state.works.find(x=>x.id===id);if(!w)return;const s=state.students.find(x=>x.id===w.student_id);const nm=s?(short?shortName(s.full_name):s.full_name):'';modalRoot.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button>${detailHTML(w,nm,true)}</div></div>`};window.closeModal=()=>modalRoot.innerHTML='';
function detailHTML(w,nm,withAudio){return `<div class="detail"><div>${w.photo_data?`<img src="${w.photo_data}" alt="${esc(w.hero_name)}">`:''}</div><div><div class="eyebrow">Герой Отечественной войны</div><h2>${esc(w.hero_name)}</h2><p style="color:rgba(255,255,255,.65)">Рассказывает ${esc(nm)}</p>${withAudio&&w.audio_data?`<div class="audioBox" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)"><audio controls src="${w.audio_data}" style="width:100%"></audio></div>`:''}<dl class="answers">${QUESTIONS.map(([k,q])=>`<dt>${q}</dt><dd>${esc(w[k])}</dd>`).join('')}</dl></div></div>`}
function renderExhibition(){const publicMode=!!state.settings.public_publication;app.innerHTML=`<div class="top" style="min-height:260px">${nav()}<div class="wrap hero" style="padding:42px 0"><div class="eyebrow">Выставка · только просмотр</div><h1 style="font-size:55px">Герои Отечественной войны</h1><p>${state.works.length} готовых работ класса 3R4.<br><span style="color:var(--gold);font-weight:700">${SCHOOL}</span><br><span style="color:var(--gold)">Учитель: ${TEACHER}</span></p></div></div><main class="wrap"><section class="section"><div class="toolbar"><input class="search" id="searchEx" placeholder="Поиск по герою" oninput="state.filter=this.value;renderGallery(${publicMode})"><button class="btn navy" onclick="go('/show')">▶ Режим показа</button></div><div id="gallery"></div></section></main><div class="footer">Выставка цифрового музея 3R4 · ${SCHOOL} · ${TEACHER}</div>`;renderGallery(publicMode)}
async function renderStudent(id){const s=state.students.find(x=>x.id===id);if(!s){go('/');return}app.innerHTML=`<div class="pagehead">${nav()}<div class="wrap"><button class="back" onclick="go('/')">← К списку класса</button><h1 style="font:600 42px Georgia,serif;margin:8px 0">${esc(s.full_name)}</h1><p style="margin:0;color:var(--gold);font-weight:700">${SCHOOL}</p><p style="margin:4px 0 0;color:rgba(255,255,255,.7)">Учитель: ${TEACHER}</p></div></div><main class="wrap"><div id="studentArea" class="paper">Проверяем карточку…</div></main>`;const pin=sessionStorage.getItem('museum_pin_'+id);if(pin){const {data}=await sb.rpc('museum_verify_pin',{p_student_id:id,p_pin:pin});if(data)return renderEditor(id,pin)}const {data,error}=await sb.rpc('museum_pin_status',{p_student_id:id});if(error)return studentMsg(error.message);renderPin(id,!!data)}
function studentMsg(t){const a=document.getElementById('studentArea');if(a)a.innerHTML=`<div class="msg err">${esc(t)}</div>`}
function renderPin(id,hasPin){const s=state.students.find(x=>x.id===id);document.getElementById('studentArea').innerHTML=`<div class="pinbox"><div class="eyebrow" style="color:var(--gold)">${hasPin?'Вход в карточку':'Первый вход'}</div><h2 style="font:600 34px Georgia,serif">${hasPin?'Введите свой PIN':'Придумайте PIN'}</h2><p class="sub">${hasPin?'PIN защищает вашу работу от изменений другими учениками.':'Введите 4 цифры и запомните их. Они понадобятся, если вы захотите изменить работу позже.'}</p><div class="field"><input id="pin1" class="input pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••"></div>${hasPin?'':`<div class="field" style="margin-top:10px"><input id="pin2" class="input pin" inputmode="numeric" maxlength="4" type="password" placeholder="повторите"></div>`}<div id="pinMsg"></div><button class="btn gold" style="width:100%;margin-top:15px" onclick="submitPin(${id},${hasPin})">${hasPin?'Открыть карточку':'Сохранить PIN и продолжить'}</button></div>`}
window.submitPin=async(id,hasPin)=>{const p=document.getElementById('pin1').value.replace(/\D/g,'').slice(0,4),m=document.getElementById('pinMsg');if(p.length!==4){m.innerHTML='<div class="msg err">PIN должен состоять из 4 цифр.</div>';return}if(!hasPin&&p!==document.getElementById('pin2').value){m.innerHTML='<div class="msg err">PIN-коды не совпадают.</div>';return}const r=hasPin?await sb.rpc('museum_verify_pin',{p_student_id:id,p_pin:p}):await sb.rpc('museum_set_pin',{p_student_id:id,p_pin:p});if(r.error){m.innerHTML=`<div class="msg err">${esc(r.error.message)}</div>`;return}const ok=hasPin?r.data:r.data?.ok;if(!ok){m.innerHTML=`<div class="msg err">${esc(r.data?.error||'Неверный PIN.')}</div>`;return}sessionStorage.setItem('museum_pin_'+id,p);renderEditor(id,p)};
let editorMedia={photo:null,photoMime:null,audio:null,audioMime:null,audioDuration:null,rec:null,stream:null,timer:null,start:0};
function renderEditor(id,pin){const s=state.students.find(x=>x.id===id),w=workFor(id);editorMedia={photo:w?.photo_data||null,photoMime:w?.photo_mime||null,audio:w?.audio_data||null,audioMime:w?.audio_mime||null,audioDuration:w?.audio_duration||null,rec:null,stream:null,timer:null,start:0};document.getElementById('studentArea').innerHTML=`${state.settings.project_locked?'<div class="msg err">Проект завершён. Редактирование закрыто учителем.</div>':''}<div class="formgrid"><div class="field"><label>1. Твой герой</label><input id="hero" class="input" maxlength="80" placeholder="Имя и фамилия героя" value="${esc(w?.hero_name||'')}" oninput="scheduleHeroCheck(${id})"><small>Можно написать имя и фамилию в любом порядке; отчество тоже можно добавить. Сайт проверит, не выбран ли уже этот герой.</small><div id="heroCheck"></div></div><div class="field"><label>2. Фотография героя</label><div class="drop"><input id="photo" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" onchange="pickPhoto(event)"><div id="photoPreview">${w?.photo_data?`<img class="previewimg" src="${w.photo_data}">`:''}</div><small>JPG, JPEG, PNG или WEBP. Фото автоматически уменьшится.</small></div></div><div class="field"><label>3. Три коротких ответа</label>${QUESTIONS.map(([k,q])=>`<div style="margin-top:15px"><b>${q}</b><textarea id="${k}" class="textarea" maxlength="1200">${esc(w?.[k]||'')}</textarea></div>`).join('')}</div><div class="field"><label>4. Аудиорассказ</label><div class="audioBox"><p class="sub">Запись — до 2 минут. Аудиорассказ обязателен для завершения работы.</p><div id="recArea">${audioPreview()}</div></div></div><div id="saveMsg"></div><button class="btn gold" style="padding:15px" onclick="saveStudentWork(${id})" ${state.settings.project_locked?'disabled':''}>Сохранить работу</button></div>`;if(w?.hero_name)setTimeout(()=>checkHeroNow(id),80)}
window.pickPhoto=async ev=>{const f=ev.target.files?.[0],p=document.getElementById('photoPreview');if(!f)return;const ext=f.name.split('.').pop().toLowerCase();if(['heic','heif'].includes(ext)||/hei[cf]/i.test(f.type)){p.innerHTML='<div class="msg err">HEIC не поддерживается. Сохраните фотографию как JPG/PNG или выберите другую.</div>';return}if(!['jpg','jpeg','png','webp'].includes(ext)||!/^image\/(jpeg|png|webp)$/i.test(f.type)){p.innerHTML='<div class="msg err">Разрешены JPG, JPEG, PNG и WEBP.</div>';return}try{const data=await compressImage(f);editorMedia.photo=data;editorMedia.photoMime='image/jpeg';p.innerHTML=`<img class="previewimg" src="${data}">`}catch(e){p.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}};
function compressImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height,max=1100;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let q=.76,data=c.toDataURL('image/jpeg',q);while(data.length>1300000&&q>.45){q-=.08;data=c.toDataURL('image/jpeg',q)}URL.revokeObjectURL(url);if(data.length>2400000)rej(new Error('Фотография слишком большая. Выберите другую.'));else res(data)};img.onerror=()=>rej(new Error('Не удалось прочитать фотографию.'));img.src=url})}
function audioPreview(){if(editorMedia.audio)return `<audio controls src="${editorMedia.audio}" style="width:100%"></audio><div class="actions"><button class="btn outline" onclick="clearAudio()">Удалить и записать заново</button></div>`;return `<div id="timer" class="timer hidden">0:00</div><button class="btn navy" onclick="startRecord()">🎙 Начать запись</button>`}
window.clearAudio=()=>{editorMedia.audio=null;editorMedia.audioMime=null;editorMedia.audioDuration=null;document.getElementById('recArea').innerHTML=audioPreview()};
window.startRecord=async()=>{const area=document.getElementById('recArea');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});editorMedia.stream=stream;const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];let mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';const rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});editorMedia.rec=rec;const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(editorMedia.timer);const dur=Math.min(120,Math.round((Date.now()-editorMedia.start)/1000)),blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});if(dur<1){area.innerHTML='<div class="msg err">Запись слишком короткая.</div>'+audioPreview();return}const data=await blobToDataURL(blob);if(data.length>4800000){area.innerHTML='<div class="msg err">Запись получилась слишком большой. Запишите немного короче.</div>'+audioPreview();return}editorMedia.audio=data;editorMedia.audioMime=blob.type;editorMedia.audioDuration=dur;area.innerHTML=audioPreview()};editorMedia.start=Date.now();rec.start(300);area.innerHTML=`<div id="timer" class="timer">0:00</div><p class="sub">Идёт запись… максимум 2 минуты.</p><button class="btn red" onclick="stopRecord()">■ Остановить</button>`;editorMedia.timer=setInterval(()=>{const s=Math.floor((Date.now()-editorMedia.start)/1000),t=document.getElementById('timer');if(t)t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=120)stopRecord()},250)}catch(e){area.innerHTML='<div class="msg err">Нет доступа к микрофону. Разрешите микрофон в браузере и попробуйте снова.</div>'+audioPreview()}};
window.stopRecord=()=>{if(editorMedia.rec&&editorMedia.rec.state!=='inactive')editorMedia.rec.stop()};
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
let heroCheckTimer=null;
window.scheduleHeroCheck=id=>{clearTimeout(heroCheckTimer);const el=document.getElementById('heroCheck');if(el)el.innerHTML='<div class="msg">Проверяем героя…</div>';heroCheckTimer=setTimeout(()=>checkHeroNow(id),450)};
async function checkHeroNow(id){const el=document.getElementById('heroCheck'),input=document.getElementById('hero');if(!el||!input)return true;const name=input.value.trim();if(name.length<3){el.innerHTML='';return null}const r=await sb.rpc('museum_check_hero',{p_student_id:id,p_hero_name:name});if(r.error){el.innerHTML='<div class="msg err">Не удалось проверить героя. Попробуй ещё раз.</div>';return null}if(r.data?.available===false){el.innerHTML=`<div class="msg err">Этот герой уже занят. Выбери другого.${r.data.takenBy?' Уже выбрал(а): '+esc(r.data.takenBy):''}</div>`;return false}if(r.data?.available===true){el.innerHTML='<div class="msg ok">✓ Герой свободен</div>';return true}el.innerHTML='';return null}
window.saveStudentWork=async id=>{const m=document.getElementById('saveMsg'),pin=sessionStorage.getItem('museum_pin_'+id);if(!editorMedia.audio){m.innerHTML='<div class="msg err">Сначала запиши аудиорассказ. Без аудио работа не считается готовой.</div>';return}const free=await checkHeroNow(id);if(free===false){m.innerHTML='<div class="msg err">Этот герой уже занят. Выбери другого.</div>';return}m.innerHTML='<div class="msg">Сохраняем…</div>';const p={p_student_id:id,p_pin:pin,p_hero_name:document.getElementById('hero').value,p_who_is_hero:document.getElementById('who_is_hero').value,p_what_did:document.getElementById('what_did').value,p_what_remembered:'',p_why_chosen:document.getElementById('why_chosen').value,p_photo_data:editorMedia.photo,p_photo_mime:editorMedia.photoMime,p_audio_data:editorMedia.audio,p_audio_mime:editorMedia.audioMime,p_audio_duration:editorMedia.audioDuration};const r=await sb.rpc('museum_save_work',p);if(r.error){m.innerHTML=`<div class="msg err">${esc(r.error.message)}</div>`;return}if(!r.data?.ok){m.innerHTML=`<div class="msg err">${esc(r.data?.error||'Не удалось сохранить.')} ${r.data?.takenBy?'Героя выбрал(а): '+esc(r.data.takenBy):''}</div>`;return}m.innerHTML='<div class="msg ok">Работа сохранена и уже появилась в общей галерее.</div>';await loadData();setTimeout(()=>go('/'),650)};
function renderShow(){if(!state.showStarted){app.innerHTML=`<div class="show"><div class="showbar"><div class="brand">✦ Память в наших сердцах</div><button class="btn outline" onclick="go('/')">✕ Выйти</button></div><div class="startshow"><div><div class="eyebrow">Презентация класса 3R4</div><h1>Память в наших сердцах</h1><p style="color:var(--gold);font-weight:700">${SCHOOL}</p><p style="color:var(--gold);font-weight:700">${TEACHER}</p><p style="color:rgba(255,255,255,.68);max-width:650px">На каждом слайде появится герой и рассказ ученика. После нажатия «Начать показ» аудио будет запускаться автоматически, когда это разрешает браузер.</p><button class="btn gold" style="margin-top:18px;padding:16px 26px" onclick="startShow()">▶ Начать показ</button></div></div></div>`;return}renderSlide()}
window.startShow=()=>{state.showStarted=true;state.showIndex=0;renderSlide()};
function renderSlide(){if(!state.works.length){app.innerHTML='<div class="show"><div class="startshow"><div><h1>Пока нет готовых работ</h1><button class="btn gold" onclick="go(\'/\')">На главную</button></div></div></div>';return}if(state.showIndex>=state.works.length)state.showIndex=0;const w=state.works[state.showIndex],s=state.students.find(x=>x.id===w.student_id),nm=state.settings.public_publication?shortName(s.full_name):s.full_name;app.innerHTML=`<div class="show"><div class="showbar"><div class="brand">✦ Память в наших сердцах <small style="opacity:.55">· ${state.showIndex+1}/${state.works.length}</small></div><button class="btn outline" onclick="exitShow()">✕ Выйти</button></div><div class="slide"><div>${w.photo_data?`<img src="${w.photo_data}" alt="${esc(w.hero_name)}">`:''}</div><div class="slidecopy"><div class="eyebrow">Герой Отечественной войны</div><h1>${esc(w.hero_name)}</h1><p style="color:rgba(255,255,255,.62)">Рассказывает ${esc(nm)} · ${SCHOOL} · Учитель: ${TEACHER}</p>${w.audio_data?`<div class="audioBox" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)"><audio id="slideAudio" controls src="${w.audio_data}" style="width:100%"></audio><button id="audioFallback" class="btn gold hidden" style="margin-top:10px" onclick="document.getElementById('slideAudio').play()">🔊 Включить рассказ</button></div>`:''}<dl class="answers">${QUESTIONS.map(([k,q])=>`<dt>${q}</dt><dd>${esc(w[k])}</dd>`).join('')}</dl></div></div><div class="showcontrols"><button class="btn outline" onclick="prevSlide()">← Назад</button><button class="btn gold" onclick="nextSlide()">Дальше →</button></div></div>`;if(w.audio_data)setTimeout(()=>{const a=document.getElementById('slideAudio'),f=document.getElementById('audioFallback');a?.play().catch(()=>f?.classList.remove('hidden'))},80)}
window.nextSlide=()=>{state.showIndex=(state.showIndex+1)%state.works.length;renderSlide()};window.prevSlide=()=>{state.showIndex=(state.showIndex-1+state.works.length)%state.works.length;renderSlide()};window.exitShow=()=>{state.showStarted=false;go('/')};document.addEventListener('keydown',e=>{if(route()==='/show'&&state.showStarted){if(e.key==='ArrowRight')nextSlide();if(e.key==='ArrowLeft')prevSlide();if(e.key==='Escape')exitShow()}});
async function renderAdmin(){app.innerHTML=`<div class="pagehead">${nav()}<div class="wrap"><button class="back" onclick="go('/')">← На главную</button><h1 style="font:600 42px Georgia,serif">Панель учителя</h1><p style="color:rgba(255,255,255,.7)">${TEACHER}</p></div></div><main class="wrap"><div id="adminArea" class="paper">Проверяем доступ…</div></main>`;const code=sessionStorage.getItem('museum_admin');if(code){const r=await sb.rpc('museum_admin_login',{p_code:code});if(!r.error&&r.data)return adminDashboard(code)}const h=await sb.rpc('museum_admin_has_code');if(h.error)return adminMsg(h.error.message);adminLoginForm(!!h.data)}
function adminMsg(t){document.getElementById('adminArea').innerHTML=`<div class="msg err">${esc(t)}</div>`}
function adminLoginForm(has){document.getElementById('adminArea').innerHTML=`<div class="pinbox"><div class="eyebrow" style="color:var(--gold)">${has?'Доступ учителя':'Первичная настройка'}</div><h2 style="font:600 34px Georgia,serif">${has?'Введите код учителя':'Создайте код учителя'}</h2><p class="sub">${has?'Этот код нужен только вам.':'Придумайте код минимум из 6 символов. Сохраните его у себя.'}</p><input id="adminCode" class="input" type="password" placeholder="Код учителя"><div id="adminMsg"></div><button class="btn gold" style="width:100%;margin-top:14px" onclick="submitAdmin(${has})">${has?'Войти':'Создать код'}</button></div>`}
window.submitAdmin=async has=>{const code=document.getElementById('adminCode').value,m=document.getElementById('adminMsg');if(code.length<6){m.innerHTML='<div class="msg err">Минимум 6 символов.</div>';return}const r=has?await sb.rpc('museum_admin_login',{p_code:code}):await sb.rpc('museum_admin_setup',{p_code:code});if(r.error){m.innerHTML=`<div class="msg err">${esc(r.error.message)}</div>`;return}const ok=has?r.data:r.data?.ok;if(!ok){m.innerHTML=`<div class="msg err">${esc(r.data?.error||'Неверный код.')}</div>`;return}sessionStorage.setItem('museum_admin',code);adminDashboard(code)};
function adminDashboard(code){const x=stats();document.getElementById('adminArea').innerHTML=`<div class="toggles"><div class="togglecard"><h3>Проект завершён</h3><p class="sub">Закрыть или снова открыть редактирование детям.</p><button class="btn ${state.settings.project_locked?'gold':'navy'}" onclick="adminLock(${!state.settings.project_locked})">${state.settings.project_locked?'Открыть редактирование':'Закрыть редактирование'}</button></div><div class="togglecard"><h3>Внешняя публикация</h3><p class="sub">Во внешней выставке показывать сокращённые имена. Аудио по умолчанию не публикуется отдельно.</p><button class="btn ${state.settings.public_publication?'gold':'navy'}" onclick="adminPublic(${!state.settings.public_publication})">${state.settings.public_publication?'Выключить':'Включить'}</button></div></div><h2 style="font:600 30px Georgia,serif;margin-top:30px">Ученики · готово ${x.done} из ${x.total}</h2><div>${state.students.map(s=>{const w=workFor(s.id);return `<div class="adminrow"><b>${s.sort_order}</b><span><b>${esc(s.full_name)}</b><br><small>${w?esc(w.hero_name):'В процессе'}</small></span><span class="hideMob">${w?'Готово':'В процессе'}</span><span class="hideMob">${w?.audio_data?'🎙 аудио':'—'}</span><span style="display:flex;gap:6px"><button class="btn outline" style="padding:7px 10px" onclick="adminReset(${s.id})">PIN</button>${w?`<button class="btn red" style="padding:7px 10px" onclick="adminDelete(${s.id})">Удалить</button>`:''}</span></div>`}).join('')}</div><div class="actions"><button class="btn outline" onclick="sessionStorage.removeItem('museum_admin');renderAdmin()">Выйти</button></div>`}
window.adminLock=async v=>{const code=sessionStorage.getItem('museum_admin'),r=await sb.rpc('museum_admin_set_locked',{p_code:code,p_value:v});if(r.data){await loadData();renderAdmin()}else alert('Не удалось изменить настройку.')};window.adminPublic=async v=>{const code=sessionStorage.getItem('museum_admin'),r=await sb.rpc('museum_admin_set_public',{p_code:code,p_value:v,p_audio:false});if(r.data){await loadData();renderAdmin()}else alert('Не удалось изменить настройку.')};window.adminReset=async id=>{if(!confirm('Сбросить PIN этого ученика? Работа останется.'))return;const code=sessionStorage.getItem('museum_admin'),r=await sb.rpc('museum_admin_reset_pin',{p_code:code,p_student_id:id});if(r.data)alert('PIN сброшен.');else alert('Не удалось сбросить PIN.')};window.adminDelete=async id=>{if(!confirm('Удалить работу полностью?'))return;const code=sessionStorage.getItem('museum_admin'),r=await sb.rpc('museum_admin_delete_work',{p_code:code,p_student_id:id});if(r.data){await loadData();renderAdmin()}else alert('Не удалось удалить работу.')};
setInterval(async()=>{if(['/','/exhibition'].includes(route())){try{await loadData();if(route()==='/')renderHome();else renderExhibition()}catch{}}},30000);
boot();
</script>
